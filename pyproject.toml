
[project]
name = "loancheck"
version = "0.1.0"
description = "Loan approval prediction MLOps project"
requires-python = ">=3.12"
dependencies = [
    "dvc",
    "fastapi",
    "matplotlib",
    "mlflow",
    "numpy",
    "pandas",
    "pandera",
    "pydantic-settings",
    "pyyaml",
    "scikit-learn",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "scikit-learn-stubs",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
